[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscill"
version = "0.1.0"
description = "Python control and measurement toolkit for USB/VISA oscilloscopes (Linux/NI-VISA, PyQt5 + PyQtGraph GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyvisa>=1.14",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15,<6",
    "pyqtgraph>=0.13,<0.14",
    "numpy>=1.20",
]
usb = ["pyvisa-py>=0.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright[nodejs]>=1.1.390",
    "ruff>=0.9",
    "PyQt5>=5.15,<6",
    "pyqtgraph>=0.13,<0.14",
    "numpy>=1.20",
]

[project.scripts]
oscill = "oscill.cli:main"
oscill-gui = "oscill.gui:main"

[tool.setuptools.packages.find]
include = ["oscill*"]
